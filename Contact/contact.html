<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="/styles/contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,100..900;1,100..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Italianno&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo"><img src="/images/Logo.svg" alt=""></div>
        <nav class="nav-links">
            <a href="#projects">Projects</a>
            <a href="#contact" class="nav-link-active" aria-current="page">Contact</a>
        </nav>
    </header>

    <!-- Main Section (Hero + Form) -->
    <main class="hero-container">
        <div class="hero-text">
            <h1>Full set of great
                <br>features to make your
                <br>product fresh</h1>
            <p>Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
        </div>
        
        <div class="form-container">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </main>

    <!-- Map Section -->
    <section class="map-section">
        <!-- You can replace this placeholder with an actual embedded Google Map iframe or Leaflet JS canvas -->
        <div class="map-placeholder">
            <img src="/images/Map.png" alt="Map section">
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="logo"><img src="/images/Logo.svg" alt=""></div>
        <div class="footer-right">
            <nav class="footer-links">
                <a href="#projects">Projects</a>
                <a href="#contact" class="nav-link-active" aria-current="page">Contact</a>
            </nav>
            <div class="social-icons">
                <!-- Using basic text/unicode representation. Replace with FontAwesome or SVG icons -->
                <a href="#" aria-label="Dribbble"><img src="/images/dribbble-logo.png" alt=""></a>
                <a href="#" aria-label="Instagram"><img src="/images/instagram.png" alt=""></a>
                <a href="#" aria-label="Twitter"><img src="/images/twitter-logo.png" alt=""></a>
            </div>
        </div>
    </footer>

</body>
</html>
